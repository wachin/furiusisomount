name: build-appimage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libglib2.0-0 \
            libgl1 \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install PyQt6

      - name: Install package in user site
        run: |
          pip install --user .
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Get version
        id: version
        run: |
          echo "version=$(python3 -c 'import furiusisomount; print(furiusisomount.__version__)')" >> $GITHUB_OUTPUT

      - name: Download linuxdeploy
        run: |
          curl -L -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Download linuxdeploy-plugin-python
        run: |
          curl -L -o linuxdeploy-plugin-python-x86_64.AppImage \
            https://github.com/nickiealeixo/linuxdeploy-plugin-python/releases/download/continuous/linuxdeploy-plugin-python-x86_64.AppImage
          chmod +x linuxdeploy-plugin-python-x86_64.AppImage

      - name: Create AppDir
        run: |
          APPIMAGE_EXTRACT_AND_APP_DIR=1 \
          ./linuxdeploy-plugin-python-x86_64.AppImage \
            --python-version python3.13 \
            --output app \
            -- \
            --appdir AppDir \
            --executable "$HOME/.local/bin/furiusisomount" \
            --desktop-file data/furiusisomount.desktop \
            --icon-file resources/icons/furiusisomount.png

      - name: Copy data files into AppDir
        run: |
          mkdir -p AppDir/usr/share/furiusisomount/translations
          cp translations/*.qm AppDir/usr/share/furiusisomount/translations/ 2>/dev/null || true
          mkdir -p AppDir/usr/share/applications
          cp data/furiusisomount.desktop AppDir/usr/share/applications/
          mkdir -p AppDir/usr/share/metainfo
          cp data/furiusisomount.metainfo.xml AppDir/usr/share/metainfo/

      - name: Package AppImage
        run: |
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage \
            --icon-file resources/icons/furiusisomount.png
          mv FuriusIsoMount-x86_64.AppImage furiusisomount-${{ steps.version.outputs.version }}-x86_64.AppImage

      - name: Compute checksum
        run: |
          sha256sum furiusisomount-*.AppImage | tee sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: furiusisomount-${{ steps.version.outputs.version }}-x86_64.AppImage
          path: |
            furiusisomount-*.AppImage
            sha256.txt

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            furiusisomount-*.AppImage
            sha256.txt
          append_to_existing: true