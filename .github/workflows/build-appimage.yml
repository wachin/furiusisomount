name: build-appimage

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install appimage-builder
        run: |
          wget -q "https://github.com/AppImageCrafters/appimage-builder/releases/download/v1.1.0/appimage-builder-1.1.0-x86_64.AppImage" -O appimage-builder
          chmod +x appimage-builder
          sudo mv appimage-builder /usr/local/bin/appimage-builder

      - name: Get version
        id: version
        run: |
          VERSION=$(python3 -c "import sys; sys.path.insert(0, '.'); import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create AppImage recipe
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cat > appimage-builder.yml << RECIPE
          version: 1

          AppDir:
            path: ./FuriusIsoMount.AppDir
            app_info:
              name: FuriusIsoMount
              title: Furius ISO Mount
              icon: resources/icons/furiusisomount.png
              exec: usr/bin/furiusisomount
              version: ${VERSION}
            apt:
              arch: amd64
              sources:
                - sourceline: 'deb http://archive.ubuntu.com/ubuntu/ noble main universe'
              include:
                - python3
                - python3-pip
                - python3-pyqt6
                - python3-fuseiso
                - fuseiso
                - udisks2
                - bchunk
                - libfuse2
                - libglib2.0-0
            script:
              - pip3 install .
              - mkdir -p usr/share/furiusisomount/translations
              - cp translations/furiusisomount_*.qm usr/share/furiusisomount/translations/ 2>/dev/null || true
              - cp data/furiusisomount.desktop usr/share/applications/
              - cp data/furiusisomount.metainfo.xml usr/share/metainfo/
              - cp resources/icons/furiusisomount.png usr/share/icons/hicolor/128x128/apps/
          RECIPE
          cat appimage-builder.yml

      - name: Build AppImage
        run: |
          appimage-builder --recipe appimage-builder.yml

      - name: Find and rename AppImage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          find . -maxdepth 1 -name "FuriusIsoMount-x86_64.AppImage" -exec mv {} furiusisomount-${VERSION}-x86_64.AppImage \;
          ls -la furiusisomount-*.AppImage

      - name: Compute checksum
        run: |
          sha256sum furiusisomount-*.AppImage | tee sha256.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: furiusisomount-${{ steps.version.outputs.version }}-x86_64.AppImage
          path: |
            furiusisomount-*.AppImage
            sha256.txt

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            furiusisomount-*.AppImage
            sha256.txt
          append_to_existing: true